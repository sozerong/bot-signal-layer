# 근거마다 계열과 지금 쓰는 규칙 버전 (implementation_design.md 4.2절).
# SQL은 sql/evidence/<이름>/<버전>.sql. 옛 버전 파일은 지우지 않는다 (평가에서 버전끼리 비교).
# lockstep_ratio가 v2로 시작하는 이유: 사전 실험 v1(절대 수)은 트렌딩 저장소 오탐으로 버렸다.
declared_app:   {family: self_report,  current: v1, entity: gh_account}
always_on:      {family: behavior,     current: v1, entity: gh_account}
low_activity:   {family: coordination, current: v1, entity: [gh_account, gh_repo]}
lockstep_ratio: {family: coordination, current: v2, entity: gh_repo}
burst_5m:       {family: coordination, current: v1, entity: gh_repo}
multi_repo_burst: {family: behavior,   current: v2, entity: gh_account}  # v2: 계정 피처에서 읽는다 (F-12, 결정 13)

# 피처 버전 (결정 9). family가 없는 항목은 근거가 아니다. f1 = sql/silver/features_repo.sql, fN = features_repo_fN.sql
features_repo:  {current: f1}

# 웹 원천 AUTH 근거 (handoff_v5_wp1.md 1-3, 결정 26). 피처 표 없이 bot.silver.events를 바로 읽는다
declared_ua:       {family: self_report, current: v1, entity: web_client}
assetless_browser: {family: behavior,    current: v1, entity: web_client}  # strict만 (policy_family.csv의 behavior)
ai_agent_ua:       {family: ai_agent,    current: v1, entity: web_client}  # 범주. policy_family.csv에 없어 어느 정책도 빼지 않는다

version: 2
# 분석팀에 주는 표(real_user_*, impact)는 모델 계약을 건다 (4.3절). 컬럼 이름이나 형이 바뀌면 빌드가 실패한다.
# 형 이름은 DuckDB 기준이다. 이식 때(C3) BigQuery 이름으로 바꾸는 곳이 여기다.
# meta evidence_families: 이 모델의 결과를 바꿀 수 있는 근거 계열. 정책이 계열을 고르는 조인은 컬럼 리니지가 모르므로 사람이 적는다.
# lineage/impact.py가 바뀐 근거의 계열과 겹치지 않는 모델을 다시 만들지 않는다. 적지 않은 모델은 모든 계열을 쓴다고 본다.
# 정책 뷰의 계열은 seeds/policy_family.csv와 같아야 한다. tests/test_gold_meta.py가 SQL, 시드와 대조한다 (결정 15)

x-event-columns: &event_columns
  - {name: source,      data_type: varchar}
  - {name: event_id,    data_type: varchar}
  - {name: event_ts,    data_type: timestamp with time zone}
  - {name: event_date,  data_type: date}
  - {name: actor_key,   data_type: varchar}
  - {name: actor_name,  data_type: varchar}
  - {name: action,      data_type: varchar}
  - {name: target,      data_type: varchar}
  - {name: target_name, data_type: varchar}

# 컬럼 사전 (handoff_delivery.md D1, 결정 38). 화면에 나가는 표의 컬럼마다 description(설명: 계산식, NULL의 뜻)과
# meta.ko(한글 이름), meta.unit(단위)을 적는다. 예시값은 내보내기가 데이터에서 뽑는다.
# scripts/export_site.py가 하나라도 비면 실패한다. unit이 "비율"이면 화면이 %로 보인다 (F-25).
# 여러 표에 같은 뜻으로 나오는 컬럼은 여기 한 번만 적고 앵커로 쓴다.
x-site-common:
  - &c_source     {name: source,     description: "데이터를 가져온 곳이에요. 화면 파일에는 GitHub(gh)만 있어요", meta: {ko: 원천, unit: 글자}}
  - &c_event_date {name: event_date, description: "이벤트가 일어난 날(UTC)이에요", meta: {ko: 날짜, unit: 날짜}}
  - &c_metric     {name: metric, description: "지표 이름이에요. active_accounts(활동 계정 수), events(이벤트 수), events_per_account(계정당 이벤트), top100_kept(star 상위 100 중 거른 뒤에도 100위 안에 남은 저장소 수), repos_flagged(봇으로 판정된 저장소 수)", meta: {ko: 지표, unit: 글자}}
  - &c_kind       {name: kind, description: "지표 종류예요. count(셈), mean(평균이라 n, 분산, MDE를 같이 채움), ratio(비율이라 분자와 분모를 따로 채움), detection(봇 판정 수 자체라 기본 정책 규칙 대상이 아님)", meta: {ko: 지표 종류, unit: 글자}}
  - &c_treatment  {name: treatment, description: "봇 필터 강도예요. none(원본), lenient(약하게), balanced(보통), strict(강하게), cap_top1(거르지 않고 계정당 이벤트를 그날 상위 1% 값으로 자르기)", meta: {ko: 필터 강도, unit: 글자}}
  - &c_ruleset_id {name: ruleset_id, description: "판정 규칙 전부(정책 시드, 근거 SQL, 피처 SQL, 판정 모델)를 해시한 12자리 id예요. 규칙이 하나라도 바뀌면 바뀌어요", meta: {ko: 규칙 묶음 id, unit: 글자}}
  - &c_n_acct     {name: n, description: "평균을 낸 계정 수예요", meta: {ko: 계정 수, unit: 개}}
  - &c_mean       {name: mean, description: "계정당 이벤트 평균이에요", meta: {ko: 평균, unit: 건}}
  - &c_variance   {name: variance, description: "계정당 이벤트의 표본 분산이에요", meta: {ko: 분산, unit: 건²}}

models:
  - name: real_user_events
    description: 이벤트 + 정책별 실유저 여부. 분석팀은 보통 정책 이름의 뷰(real_user_<정책>)를 쓴다
    config: {contract: {enforced: true}}
    columns:
      - {name: source,          data_type: varchar}
      - {name: event_id,        data_type: varchar}
      - {name: event_ts,        data_type: timestamp with time zone}
      - {name: event_date,      data_type: date}
      - {name: actor_key,       data_type: varchar}
      - {name: actor_name,      data_type: varchar}
      - {name: action,          data_type: varchar}
      - {name: target,          data_type: varchar}
      - {name: target_name,     data_type: varchar}
      - {name: is_real_lenient,  data_type: boolean}
      - {name: is_real_balanced, data_type: boolean}
      - {name: is_real_strict,   data_type: boolean}
  - name: real_user_lenient
    config: {contract: {enforced: true}, meta: {evidence_families: [self_report]}}
    columns: *event_columns
  - name: real_user_balanced
    config: {contract: {enforced: true}, meta: {evidence_families: [self_report, infrastructure, coordination]}}
    columns: *event_columns
  - name: real_user_strict
    config: {contract: {enforced: true}, meta: {evidence_families: [self_report, infrastructure, behavior, coordination]}}
    columns: *event_columns
  - name: impact
    config: {contract: {enforced: true}}
    columns:
      - {name: repo_key,       data_type: varchar}
      - {name: repo_name,      data_type: varchar}
      - {name: event_date,     data_type: date}
      - {name: stars_all,      data_type: bigint}
      - {name: stars_lenient,  data_type: bigint}
      - {name: stars_balanced, data_type: bigint}
      - {name: stars_strict,   data_type: bigint}
      - {name: rank_all,       data_type: bigint}
      - {name: rank_balanced,  data_type: bigint}
  - name: entity_verdict
    columns:
      - name: category
        data_tests:
          - accepted_values: {arguments: {values: [human, declared_bot, suspected_bot]}}
  - name: fake_star_repo
    config: {meta: {evidence_families: [coordination]}}
  - name: disagreement
    config: {meta: {evidence_families: [coordination]}}
  - name: eval_pairs
    description: 시험 대상. 행마다 판정 시각 <= 정답 확인 시각
  - name: evaluation
    description: 근거 x 버전 x 정답 출처 x 판정 구간. window_end가 NULL인 행은 구간을 합친 전체 (결정 14)
    columns:
      - {name: evidence_id, description: "채점한 근거 이름이에요. fake_star_repo는 저활동 + (lockstep_ratio 또는 burst_5m)를 합친 조합 판정이에요", meta: {ko: 근거, unit: 글자}}
      - {name: rule_version, description: "근거의 버전이에요(v1, v2 …). 조합 판정은 combo예요", meta: {ko: 근거 버전, unit: 글자}}
      - {name: truth_source, description: "정답을 확인한 방법이에요. repo_deleted는 판정 뒤에 저장소가 지워졌는지(404) 본 것이에요", meta: {ko: 정답 출처, unit: 글자}}
      - {name: window_end, description: "판정한 구간의 마지막 날이에요. NULL이면 구간을 모두 합친 전체 행이에요", meta: {ko: 판정 구간 끝, unit: 날짜}}
      - {name: n_hit, description: "이 근거에 걸린 대상 수예요. 정답 확인 여부와 상관없어요", meta: {ko: 걸린 수, unit: 개}}
      - {name: n_hit_with_truth, description: "걸린 대상 중 정답을 확인한 수예요. 정밀도의 분모예요", meta: {ko: 정답 확인한 걸린 수, unit: 개}}
      - {name: n_hit_positive, description: "정답을 확인한 걸린 대상 중 정답도 봇(삭제됨)인 수예요. 정밀도의 분자예요", meta: {ko: 정답도 봇, unit: 개}}
      - {name: precision, description: "정밀도예요. n_hit_positive ÷ n_hit_with_truth, 소수 넷째 자리 반올림. 분모가 0이면 NULL이에요", meta: {ko: 정밀도, unit: 비율}}
      - {name: n_control_with_truth, description: "이 근거에 안 걸렸는데 정답을 확인한 대상 수예요(대조군)", meta: {ko: 대조군 수, unit: 개}}
      - {name: n_control_positive, description: "대조군 중 정답이 봇(삭제됨)인 수예요", meta: {ko: 대조군 중 봇, unit: 개}}
      - {name: control_positive_rate, description: "대조군 양성률이에요. n_control_positive ÷ n_control_with_truth. 정밀도가 이 값보다 충분히 높아야 근거가 뜻이 있어요", meta: {ko: 대조군 양성률, unit: 비율}}
  # v5 WP1 (지시서 handoff_v5_wp1.md 1-4, 1-5). meta owner, tags: 모델마다 누가 책임지고 무슨 묶음인지 (당근 dbt 운영 방식, docs/daangn_review.md 1절)
  - name: policy_compare
    description: 원천 x 날짜 x 지표 x 처리 방식(none, lenient, balanced, strict, cap_top1). 규칙 묶음(ruleset_id)마다 행을 쌓는다 (결정 24)
    config: {meta: {owner: bot-layer, tags: [policy, metric]}}
    columns:
      - *c_source
      - *c_event_date
      - *c_metric
      - *c_kind
      - *c_treatment
      - {name: value, description: "이 강도에서 계산한 지표 값이에요. 단위는 metric을 따라요(계정 수는 개, 이벤트 수는 건, 계정당 이벤트는 건)", meta: {ko: 값, unit: 지표마다 다름}}
      - {name: change_vs_none, description: "원본 대비 변화예요. value ÷ 같은 날 같은 지표의 none 값 − 1. -0.3이면 원본보다 30% 적어요. none 값이 0이면 NULL이에요", meta: {ko: 원본 대비, unit: 비율}}
      - {name: extra_vs_lenient, description: "약하게 대비 추가 변화예요. value ÷ lenient 값 − 1. 스스로 밝힌 봇을 뺀 뒤 더 빠지는 몫이에요. lenient 값이 0이면 NULL이에요", meta: {ko: 약하게 대비 추가, unit: 비율}}
      - {name: num_value, description: "ratio 지표의 분자예요. GitHub 지표에는 ratio가 없어 모두 NULL이에요", meta: {ko: 분자, unit: 건}}
      - {name: den_value, description: "ratio 지표의 분모예요. GitHub 지표에는 ratio가 없어 모두 NULL이에요", meta: {ko: 분모, unit: 건}}
      - {name: num_change_vs_none, description: "분자의 원본 대비 변화예요(num_value ÷ none 분자 − 1). GitHub에서는 NULL이에요", meta: {ko: 분자 원본 대비, unit: 비율}}
      - {name: den_change_vs_none, description: "분모의 원본 대비 변화예요(den_value ÷ none 분모 − 1). GitHub에서는 NULL이에요", meta: {ko: 분모 원본 대비, unit: 비율}}
      - {<<: *c_n_acct, description: "mean 지표에서 평균을 낸 계정 수예요. 다른 종류는 NULL이에요"}
      - {<<: *c_mean, description: "mean 지표의 계정당 이벤트 평균이에요. 다른 종류는 NULL이에요"}
      - {<<: *c_variance, description: "mean 지표의 계정당 이벤트 표본 분산이에요. 다른 종류는 NULL이에요"}
      - {name: rel_mde, description: "최소 탐지 효과예요. 계정을 반반 나눈 실험에서 잡을 수 있는 가장 작은 상대 차이로, 2.8 × √(2 × variance ÷ (n/2)) ÷ mean이에요(유의수준 5% 양측, 검정력 80%). mean 지표만 채워요", meta: {ko: 최소 탐지 효과, unit: 비율}}
      - {name: traffic_x_vs_none, description: "같은 MDE를 얻는 데 드는 계정 수를 원본 대비 배수로 본 값이에요. (rel_mde ÷ none의 rel_mde)². 1보다 작으면 원본보다 적은 트래픽으로 같은 실험을 할 수 있어요", meta: {ko: 필요 트래픽 (원본 대비 배수), unit: 배}}
      - *c_ruleset_id
  - name: policy_compare_released
    description: 분석가 기본 뷰. 가장 최근 공개 규칙 묶음의 policy_compare만
    config: {meta: {owner: bot-layer, tags: [policy, metric, surface]}}
  - name: ruleset_change_log
    description: 기본 규칙 묶음 대 다른 묶음, 지표 x 날짜 x 처리 방식마다 바뀐 폭
    config: {meta: {owner: bot-layer, tags: [policy, ruleset, surface]}}
    columns:
      - *c_source
      - *c_event_date
      - *c_metric
      - *c_kind
      - *c_treatment
      - {name: base_ruleset, description: "비교 기준인 가장 최근 공개 규칙 묶음 id예요", meta: {ko: 공개 버전, unit: 글자}}
      - {name: other_ruleset, description: "policy_compare에 있는 다른 규칙 묶음 id예요. 예전 공개 묶음이거나 공개 전 후보예요", meta: {ko: 비교한 버전, unit: 글자}}
      - {name: base_value, description: "공개 버전으로 계산한 지표 값이에요. 단위는 metric을 따라요", meta: {ko: 공개 버전 값, unit: 지표마다 다름}}
      - {name: other_value, description: "비교한 버전으로 계산한 지표 값이에요. 단위는 metric을 따라요", meta: {ko: 비교한 버전 값, unit: 지표마다 다름}}
      - {name: diff, description: "other_value − base_value예요. 0이면 두 버전의 숫자가 같아요", meta: {ko: 차이, unit: 지표마다 다름}}
      - {name: rel_change, description: "상대 변화예요. other_value ÷ base_value − 1. base_value가 0이면 NULL이에요", meta: {ko: 상대 변화, unit: 비율}}
  - name: metric_policy_proposal
    description: 지표별 기본 정책 제안(자연 변동 대비 규칙). 사람이 보고 seeds/metric_policy.csv에 옮긴다
    config: {meta: {owner: bot-layer, tags: [policy, metric]}}
    columns:
      - *c_source
      - *c_metric
      - {name: natural_var, description: "자연 변동이에요. lenient 값이 날짜 사이에 바뀐 폭(절댓값)의 중앙값이에요", meta: {ko: 자연 변동, unit: 비율}}
      - {name: step_balanced, description: "balanced가 lenient보다 값을 바꾼 폭(절댓값)의 날짜별 중앙값이에요. 자연 변동보다 크면 balanced를 제안해요", meta: {ko: 보통의 추가 변화, unit: 비율}}
      - {name: step_strict, description: "strict가 balanced보다 값을 바꾼 폭(절댓값)의 날짜별 중앙값이에요. strict가 더 빼는 근거는 채점되지 않아 보고용 상한으로만 봐요", meta: {ko: 강하게의 추가 변화, unit: 비율}}
      - {name: n_days, description: "중앙값을 낸 날 수예요", meta: {ko: 날 수, unit: 일}}
      - {name: proposed_policy, description: "규칙이 제안한 강도예요. step_balanced가 natural_var보다 크면 balanced, 아니면 lenient예요. 사람이 보고 metric_policy에 옮겨요", meta: {ko: 규칙 제안, unit: 글자}}
  - name: actor_policy_status
    description: 원천 x 대상 x 날짜 x 정책 -> 실유저 여부, 빠지게 한 근거, AI 에이전트 여부, 규칙 묶음 id. 매크로 real_users가 읽는다
    config: {contract: {enforced: true}, meta: {owner: bot-layer, tags: [surface]}}
    columns:
      - {name: source,      data_type: varchar}
      - {name: entity_type, data_type: varchar}
      - {name: entity_key,  data_type: varchar}
      - {name: event_date,  data_type: date}
      - {name: policy,      data_type: varchar}
      - {name: is_real,     data_type: boolean}
      - {name: category,    data_type: varchar}
      - {name: excluded_by, data_type: varchar}
      - {name: is_ai_agent, data_type: boolean}
      - {name: ruleset_id,  data_type: varchar}
  - name: why_excluded
    description: 정책에서 실유저가 아닌 대상의 hit 근거마다 규칙 버전, 점수, metrics, 판정 시각, SQL 지문
    config: {contract: {enforced: true}, meta: {owner: bot-layer, tags: [surface]}}
    columns:
      - {name: source,       data_type: varchar}
      - {name: entity_type,  data_type: varchar}
      - {name: entity_key,   data_type: varchar}
      - {name: event_date,   data_type: date}
      - {name: policy,       data_type: varchar}
      - {name: category,     data_type: varchar}
      - {name: evidence_id,  data_type: varchar}
      - {name: rule_version, data_type: varchar}
      - {name: family,       data_type: varchar}
      - {name: score,        data_type: double}
      - {name: metrics,      data_type: varchar}
      - {name: judged_at,    data_type: timestamp with time zone}
      - {name: sql_sha256,   data_type: varchar}
      - {name: ruleset_id,   data_type: varchar}

seeds:
  - name: ruleset_release
    description: 공개한 규칙 묶음. seq가 가장 큰 줄이 분석가 숫자와 화면의 기준이다 (결정 24). 시드는 규칙 묶음 id 해시에 들지 않는다 (warehouse/dbt_build.py ruleset_parts)
    columns:
      - *c_ruleset_id
      - {name: seq, description: "공개 순번이에요. 클수록 최근이고, 화면과 분석가 기본 뷰는 가장 큰 순번을 써요", meta: {ko: 공개 순번, unit: 번}}
      - {name: released_on, description: "공개한 날이에요", meta: {ko: 공개일, unit: 날짜}}
      - {name: note, description: "엔지니어용 공개 기록이에요. 숫자가 같다는 증명과 결정 번호가 들어 있어요. 화면에서는 '자세히'에 접혀 있어요", meta: {ko: 자세한 기록, unit: 글자}}
      - {name: label, description: "분석가가 부르는 버전 이름이에요(v1, v2 …). 화면 맨 위의 '규칙 v4' 같은 표기가 이 값이에요", meta: {ko: 버전 이름, unit: 글자}}
      - {name: impact, description: "이 공개로 분석가 숫자가 바뀌는지 한 줄로 적은 것이에요", meta: {ko: 숫자 영향, unit: 글자}}
  - name: metric_policy
    description: 지표별 기본 정책. 사람이 metric_policy_proposal을 보고 정한다 (결정 24 덧붙임)
    columns:
      - *c_metric
      - {name: default_policy, description: "이 지표를 볼 때 기본으로 쓰는 필터 강도예요. 화면의 '지표별 추천'이 이 값이에요", meta: {ko: 추천 강도, unit: 글자}}
      - {name: reason, description: "이 강도를 고른 이유예요. 강도 사이 차이를 그 지표의 자연 변동과 비교해요", meta: {ko: 이유, unit: 글자}}
      - {name: measurement, description: "근거가 된 측정 기록 번호예요(docs/measurements.md의 M-번호)", meta: {ko: 측정 번호, unit: 글자}}

# dbt 모델이 아니라 scripts/export_site.py가 Gold에서 바로 만드는 화면용 표 (dbt는 x-로 시작하는 키를 읽지 않는다)
x-site-tables:
  - name: daily_action
    columns:
      - *c_source
      - *c_event_date
      - {name: action, description: "GitHub 이벤트 종류예요(WatchEvent = star, PushEvent = 코드 올리기 등)", meta: {ko: 이벤트 종류, unit: 글자}}
      - {name: events_none, description: "거르지 않은 이벤트 수예요", meta: {ko: 이벤트 (원본), unit: 건}}
      - {name: events_lenient, description: "약하게 거른 뒤 남은 이벤트 수예요", meta: {ko: 이벤트 (약하게), unit: 건}}
      - {name: events_balanced, description: "보통으로 거른 뒤 남은 이벤트 수예요", meta: {ko: 이벤트 (보통), unit: 건}}
      - {name: events_strict, description: "강하게 거른 뒤 남은 이벤트 수예요", meta: {ko: 이벤트 (강하게), unit: 건}}
      - {name: accounts_none, description: "그날 이 종류를 낸 계정 수예요. 10개 미만이면 행을 싣지 않아요", meta: {ko: 계정 (원본), unit: 개}}
      - {name: accounts_lenient, description: "약하게 거른 뒤 남은 계정 수예요", meta: {ko: 계정 (약하게), unit: 개}}
      - {name: accounts_balanced, description: "보통으로 거른 뒤 남은 계정 수예요", meta: {ko: 계정 (보통), unit: 개}}
      - {name: accounts_strict, description: "강하게 거른 뒤 남은 계정 수예요", meta: {ko: 계정 (강하게), unit: 개}}
  - name: mde_cap
    columns:
      - *c_source
      - *c_event_date
      - {<<: *c_treatment, description: "봇 필터 강도예요. none(원본), lenient(약하게), balanced(보통), strict(강하게)"}
      - {name: q, description: "자르기 백분위예요(90 ~ 100, 0.5 간격). 100이면 자르지 않아요", meta: {ko: 자르기 백분위, unit: 백분위}}
      - {<<: *c_n_acct, description: "이 강도에서 남은 계정 수예요"}
      - {name: cap_value, description: "계정당 이벤트가 이 값을 넘으면 이 값으로 낮춰요. q가 100이면 NULL이에요", meta: {ko: 자른 값, unit: 건}}
      - {<<: *c_mean, description: "자른 뒤 계정당 이벤트 평균이에요"}
      - {<<: *c_variance, description: "자른 뒤 계정당 이벤트 표본 분산이에요"}

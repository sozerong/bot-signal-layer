# bot-job 컨테이너 안에서 돈다 (/work = 레포). Silver는 iceberg_scan으로 읽는다 (models/sources.yml)
bot:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('BOT_WAREHOUSE', '/work/warehouse_local') }}/gold.duckdb"  # 표본 시험과 데모는 BOT_WAREHOUSE로 다른 창고를 준다
      extensions: [iceberg]
      threads: 4

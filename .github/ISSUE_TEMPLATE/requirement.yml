# 요구사항 받는 길 (docs/direction_v6.md Q14). 받은 요청은 화면(site/index.html)의 요구사항 카드(REQS)로 더하고, 이슈에 카드 이름을 답한다
name: 요구사항
description: 보고 싶은 숫자나 거르는 방식을 알려 주세요. 받은 요청은 화면의 "자주 쓰는 쿼리"에 추가해요
title: "[요구사항] "
labels: [requirement]
body:
  - type: textarea
    id: what
    attributes:
      label: 무엇을 알고 싶나요
      description: 한두 문장. 예) "봇을 빼면 주말 활동 계정이 얼마나 줄어드는지"
    validations: {required: true}
  - type: input
    id: metric
    attributes:
      label: 어느 지표
      description: 예) 활동 계정 수, 이벤트 수, star 상위 100, 웹 세션 수, 검색 후 상세 전환율. 목록에 없으면 정의를 적어 주세요
    validations: {required: true}
  - type: input
    id: period
    attributes:
      label: 어느 기간
      description: 예) 2024-07-15 ~ 07-21 전체, 또는 날짜 하나
    validations: {required: true}
  - type: dropdown
    id: policy
    attributes:
      label: 봇 필터 강도 (모르면 비워 두세요)
      options: [지표별 추천, 약하게 (lenient), 보통 (balanced), 강하게 (strict), 모름]
    validations: {required: false}
